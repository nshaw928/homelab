- name: Install Longhorn prerequisites
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Longhorn dependencies
      apt:
        name:
          - open-iscsi
          - nfs-common
        state: present

    - name: Enable and start iscsid service
      systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: Load iscsi_tcp kernel module
      community.general.modprobe:
        name: iscsi_tcp
        state: present

    - name: Ensure iscsi_tcp loads on boot
      lineinfile:
        path: /etc/modules-load.d/longhorn.conf
        line: iscsi_tcp
        create: yes

    - name: Blacklist Longhorn devices in multipathd
      copy:
        dest: /etc/multipath.conf
        content: |
          defaults {
              user_friendly_names yes
          }
          blacklist {
              devnode "^sd[a-z0-9]+"
              devnode "^longhorn"
          }
      notify: Restart multipathd

  handlers:
    - name: Restart multipathd
      systemd:
        name: multipathd
        state: restarted
