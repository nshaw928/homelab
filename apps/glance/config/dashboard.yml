  - name: Dashboard
    slug: ""
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: sunday

          - type: weather
            location: Greenville, SC
            units: imperial
            hour-format: 12h

      - size: full
        widgets:
          - type: monitor
            title: Applications
            cache: 1m
            sites:
              - title: Linkwarden
                url: https://linkwarden.nicholasshaw.cloud
                icon: sh:linkwarden
              - title: Spacedrive
                url: https://spacedrive.nicholasshaw.cloud
                icon: sh:spacedrive

          - type: monitor
            title: Infrastructure
            cache: 1m
            sites:
              - title: ArgoCD
                url: https://argocd.nicholasshaw.cloud
                icon: sh:argocd
              - title: Longhorn
                url: https://longhorn.nicholasshaw.cloud
                icon: sh:longhorn
              - title: Netbird
                url: https://netbird.nicholasshaw.cloud
                icon: sh:netbird

          - type: group
            widgets:
              - type: reddit
                title: r/selfhosted
                subreddit: selfhosted
                show-thumbnails: true
                collapse-after: 5
                limit: 15
              - type: reddit
                title: r/homelab
                subreddit: homelab
                show-thumbnails: true
                collapse-after: 5
                limit: 15

      - size: small
        widgets:
          - type: twitch-channels
            title: Live Streams
            channels:
              - theprimeagen
              - piratesoftware
            collapse-after: 3

          - type: videos
            title: YouTube
            channels:
              - UCsBjURrPoezykLs9EqgamOA  # Fireship
              - UCXuqSBlHAE6Xw-yeJA0Tunw  # Linus Tech Tips
            limit: 10
            collapse-after: 5
