  - name: Home
    slug: ""
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: sunday

          - $include: reddit.yml

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            autofocus: true

          - type: monitor
            title: Applications
            cache: 1m
            sites:
              - title: Linkwarden
                url: https://linkwarden.nicholasshaw.cloud
                icon: sh:linkwarden
              - title: Reactive Resume
                url: https://resume.nicholasshaw.cloud/dashboard/resumes
                icon: sh:reactiveresume
              - title: Open WebUI
                url: https://openwebui.nicholasshaw.cloud
                icon: sh:open-webui
              - title: Stoat
                url: https://stoat.nicholasshaw.cloud
                icon: sh:revolt

          - $include: bookmarks.yml

          - type: monitor
            title: Infrastructure
            cache: 1m
            sites:
              - title: ArgoCD
                url: https://argocd.nicholasshaw.cloud
                icon: sh:argocd
              - title: Longhorn
                url: https://longhorn.nicholasshaw.cloud
                icon: sh:longhorn
              - title: Netbird
                url: https://netbird.nicholasshaw.cloud
                icon: sh:netbird
              - title: Prometheus
                url: https://prometheus.nicholasshaw.cloud
                icon: sh:prometheus
              - title: Grafana
                url: https://grafana.nicholasshaw.cloud
                icon: sh:grafana
              - title: Obsidian Live Sync
                url: https://obsidian-livesync.nicholasshaw.cloud
                icon: sh:obsidian

      - size: small
        widgets:
          - type: weather
            location: 29615
            units: imperial
            hour-format: 12h

          - $include: rss.yml
