apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glance

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: glance
    files:
      - config/glance.yml
      - config/dashboard.yml
      - config/gaming.yml

generatorOptions:
  disableNameSuffixHash: true
