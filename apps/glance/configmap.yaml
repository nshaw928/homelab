apiVersion: v1
kind: ConfigMap
metadata:
  name: glance
  namespace: glance
  labels:
    app.kubernetes.io/name: glance
data:
  glance.yml: |
    server:
      host: 0.0.0.0
      port: 8080

    theme:
      light: false

    pages:
      - name: Applications
        slug: ""
        columns:
          - size: small
            widgets:
              - type: calendar
                first-day-of-week: sunday

              - type: weather
                location: Greenville, SC
                units: imperial
                hour-format: 12h

          - size: full
            widgets:
              - type: bookmarks
                title: Applications
                groups:
                  - title: Apps
                    links:
                      - title: Linkwarden
                        url: https://linkwarden.nicholasshaw.cloud
                        icon: sh:linkwarden
                      - title: Spacedrive
                        url: https://spacedrive.nicholasshaw.cloud
                        icon: sh:spacedrive

              - type: videos
                title: YouTube
                channels:
                  - UCsBjURrPoezykLs9EqgamOA  # Fireship
                  - UCXuqSBlHAE6Xw-yeJA0Tunw  # Linus Tech Tips
                limit: 6
                collapse-after: 3
                style: grid-cards

              - type: twitch-channels
                title: Twitch
                channels:
                  - theprimeagen
                  - piratesoftware
                collapse-after: 3

      - name: Infrastructure
        slug: infrastructure
        columns:
          - size: small
            widgets:
              - type: bookmarks
                title: Cluster Services
                groups:
                  - title: Management
                    links:
                      - title: ArgoCD
                        url: https://argocd.nicholasshaw.cloud
                        icon: sh:argocd
                      - title: Longhorn
                        url: https://longhorn.nicholasshaw.cloud
                        icon: sh:longhorn
                      - title: Netbird
                        url: https://netbird.nicholasshaw.cloud
                        icon: sh:netbird

          - size: full
            widgets:
              - type: reddit
                title: r/selfhosted
                subreddit: selfhosted
                style: vertical-cards
                limit: 10
                collapse-after: 5
                show-thumbnails: true

              - type: reddit
                title: r/homelab
                subreddit: homelab
                style: vertical-cards
                limit: 10
                collapse-after: 5
                show-thumbnails: true
