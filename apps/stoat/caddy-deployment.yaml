apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-caddy
  namespace: stoat
  labels:
    app.kubernetes.io/name: stoat-caddy
    app.kubernetes.io/component: routing
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoat-caddy
        app.kubernetes.io/component: routing
    spec:
      containers:
        - name: caddy
          image: caddy:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: caddyfile
          configMap:
            name: stoat-caddyfile
