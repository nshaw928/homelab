apiVersion: v1
kind: Service
metadata:
  name: stoat-mongodb
  namespace: stoat
  labels:
    app.kubernetes.io/name: stoat-mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: stoat-mongodb
