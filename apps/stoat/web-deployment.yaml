apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-web
  namespace: stoat
  labels:
    app.kubernetes.io/name: stoat-web
    app.kubernetes.io/component: frontend
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoat-web
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/revoltchat/client:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: REVOLT_PUBLIC_URL
              value: "https://stoat.nicholasshaw.cloud"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
