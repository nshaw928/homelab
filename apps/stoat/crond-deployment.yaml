apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-crond
  namespace: stoat
  labels:
    app.kubernetes.io/name: stoat-crond
    app.kubernetes.io/component: backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-crond
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoat-crond
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: crond
          image: ghcr.io/revoltchat/crond:20250930-2
          imagePullPolicy: IfNotPresent
          env:
            - name: REVOLT_CONFIG
              value: /config/Revolt.toml
          volumeMounts:
            - name: config
              mountPath: /config/Revolt.toml
              subPath: Revolt.toml
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: config
          secret:
            secretName: stoat-secrets
            items:
              - key: Revolt.toml
                path: Revolt.toml
