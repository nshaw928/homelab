apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-gifbox
  namespace: stoat
  labels:
    app.kubernetes.io/name: stoat-gifbox
    app.kubernetes.io/component: backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-gifbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoat-gifbox
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: gifbox
          image: ghcr.io/revoltchat/gifbox:20250930-2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 14706
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /Revolt.toml
              subPath: Revolt.toml
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          secret:
            secretName: stoat-secrets
            items:
              - key: Revolt.toml
                path: Revolt.toml
