apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoat-autumn
  namespace: stoat
  labels:
    app.kubernetes.io/name: stoat-autumn
    app.kubernetes.io/component: backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stoat-autumn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoat-autumn
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: create-bucket
          image: minio/mc
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set minio http://stoat-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              mc mb --ignore-existing minio/revolt-uploads
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: stoat-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stoat-secrets
                  key: MINIO_ROOT_PASSWORD
      containers:
        - name: autumn
          image: ghcr.io/stoatchat/file-server:v0.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 14704
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /Revolt.toml
              subPath: Revolt.toml
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          secret:
            secretName: stoat-secrets
            items:
              - key: Revolt.toml
                path: Revolt.toml
