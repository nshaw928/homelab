apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo-web
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-web
    app.kubernetes.io/component: web
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kaneo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaneo-web
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/usekaneo/web:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          env:
            - name: KANEO_API_URL
              value: "https://kaneo.nicholasshaw.cloud"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
