apiVersion: v1
kind: Service
metadata:
  name: kaneo-postgres
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: kaneo-postgres
