apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-init-schema
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw-postgres
    app.kubernetes.io/component: database
data:
  01-schema.sql: |
    -- Ideas discovered by Scout
    CREATE TABLE ideas (
        id SERIAL PRIMARY KEY,
        status TEXT NOT NULL DEFAULT 'raw'
            CHECK (status IN ('raw', 'approved', 'rejected', 'archived')),
        problem_summary TEXT NOT NULL,
        source_url TEXT,
        source_platform TEXT,
        raw_text TEXT,
        frequency_score INTEGER CHECK (frequency_score BETWEEN 1 AND 10),
        tags TEXT[],
        discovered_at TIMESTAMPTZ DEFAULT NOW(),
        approved_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_ideas_status ON ideas(status);

    -- Agent activity log
    CREATE TABLE agent_logs (
        id SERIAL PRIMARY KEY,
        agent_name TEXT NOT NULL,
        action TEXT NOT NULL,
        details JSONB,
        idea_id INTEGER REFERENCES ideas(id),
        created_at TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX idx_agent_logs_agent ON agent_logs(agent_name, created_at DESC);

    -- PostgREST anonymous role
    CREATE ROLE web_anon NOLOGIN;
    GRANT USAGE ON SCHEMA public TO web_anon;
    GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO web_anon;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO web_anon;

  02-postgrest-role.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD '$POSTGREST_PASSWORD';
        GRANT web_anon TO authenticator;
    EOSQL
