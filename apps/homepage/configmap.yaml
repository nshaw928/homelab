apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab Dashboard
    favicon: https://kubernetes.io/images/favicon.png
    headerStyle: clean
    layout:
      - Cluster:
          style: row
          columns: 4
      - Applications:
          style: row
          columns: 3
  bookmarks.yaml: |
    - Infrastructure:
        - ArgoCD:
            - abbr: AR
              href: https://argocd.nicholasshaw.cloud
        - Longhorn:
            - abbr: LH
              href: https://longhorn.nicholasshaw.cloud
        - Netbird:
            - abbr: NB
              href: https://netbird.nicholasshaw.cloud
  services.yaml: |
    - Cluster:
        - ArgoCD:
            href: https://argocd.nicholasshaw.cloud
            description: GitOps continuous delivery
            icon: argocd.png
        - Longhorn:
            href: https://longhorn.nicholasshaw.cloud
            description: Distributed block storage
            icon: longhorn.png
    - Applications:
        - Linkwarden:
            href: https://linkwarden.nicholasshaw.cloud
            description: Collaborative bookmark manager
            icon: linkwarden.png
        - Spacedrive:
            href: https://spacedrive.nicholasshaw.cloud
            description: File manager and organizer
            icon: spacedrive.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
