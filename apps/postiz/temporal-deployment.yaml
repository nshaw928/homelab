apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: postiz
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: workflow
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
          env:
            - name: DB
              value: postgres12
            - name: POSTGRES_SEEDS
              value: temporal-postgres
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postiz-secrets
                  key: TEMPORAL_POSTGRES_PASSWORD
            - name: ENABLE_ES
              value: "true"
            - name: ES_SEEDS
              value: temporal-elasticsearch
            - name: ES_PORT
              value: "9200"
            - name: ES_VERSION
              value: v7
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 180
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 90
            periodSeconds: 10
