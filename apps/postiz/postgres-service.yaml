apiVersion: v1
kind: Service
metadata:
  name: postiz-postgres
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postiz-postgres
