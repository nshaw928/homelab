apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reactive-resume-postgres
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: reactive-resume-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reactive-resume-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reactive-resume-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: reactive-resume
            - name: POSTGRES_DB
              value: reactive-resume
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - reactive-resume
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - reactive-resume
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
