apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume-printer
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-printer
    app.kubernetes.io/component: printer
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reactive-resume-printer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reactive-resume-printer
        app.kubernetes.io/component: printer
    spec:
      containers:
        - name: printer
          image: ghcr.io/browserless/chromium:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HEALTH
              value: "true"
            - name: CONCURRENT
              value: "20"
            - name: QUEUED
              value: "10"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /active
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /active
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
