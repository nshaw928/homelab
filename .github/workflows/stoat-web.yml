name: Build stoat-web

on:
  push:
    branches: [main]
    paths:
      - "docker/stoat-web/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nshaw928/stoat-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/stoat-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_URL=https://stoat.nicholasshaw.cloud/api
            VITE_WS_URL=wss://stoat.nicholasshaw.cloud/ws
            VITE_MEDIA_URL=https://stoat.nicholasshaw.cloud/autumn
            VITE_PROXY_URL=https://stoat.nicholasshaw.cloud/january
