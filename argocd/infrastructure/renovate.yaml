apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://docs.renovatebot.com/helm-charts
    chart: renovate
    targetRevision: 46.25.3
    helm:
      values: |
        cronjob:
          schedule: "0 */6 * * *"
        renovate:
          config: |
            {
              "platform": "github",
              "repositories": ["nshaw928/homelab"]
            }
        envFrom:
          - secretRef:
              name: renovate-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
